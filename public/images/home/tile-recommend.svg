<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-label="Spending categories flowing into Earnn, which picks the best card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2A66"/>
      <stop offset="1" stop-color="#1A4FAD"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#FFD76A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFD76A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.55" stop-color="#F7C948"/>
      <stop offset="1" stop-color="#E0A92A"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ee0b2" stop-opacity="0"/>
      <stop offset="1" stop-color="#4ee0b2" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#04112c" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="800" height="430" fill="url(#bg)"/>
  <rect width="800" height="430" fill="url(#glow)"/>
  <g fill="#ffffff" fill-opacity="0.07">
    <circle cx="60" cy="40" r="3"/><circle cx="120" cy="40" r="3"/><circle cx="180" cy="40" r="3"/><circle cx="240" cy="40" r="3"/>
    <circle cx="60" cy="90" r="3"/><circle cx="120" cy="90" r="3"/><circle cx="180" cy="90" r="3"/><circle cx="240" cy="90" r="3"/>
  </g>

  <!-- spending chips -->
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="700">
    <g transform="translate(34 62)">
      <rect width="190" height="46" rx="23" fill="#fff" filter="url(#shadow)"/>
      <circle cx="23" cy="23" r="13" fill="#E6F7F1"/><text x="23" y="28" text-anchor="middle" font-size="14">🛒</text>
      <text x="46" y="21" font-size="13" fill="#5A6A85">Groceries</text>
      <text x="46" y="37" font-size="14" fill="#0A2A66">AED 1,500</text>
    </g>
    <g transform="translate(58 128)">
      <rect width="190" height="46" rx="23" fill="#fff" filter="url(#shadow)"/>
      <circle cx="23" cy="23" r="13" fill="#FFF1D6"/><text x="23" y="28" text-anchor="middle" font-size="14">🍽</text>
      <text x="46" y="21" font-size="13" fill="#5A6A85">Dining</text>
      <text x="46" y="37" font-size="14" fill="#0A2A66">AED 800</text>
    </g>
    <g transform="translate(34 194)">
      <rect width="190" height="46" rx="23" fill="#fff" filter="url(#shadow)"/>
      <circle cx="23" cy="23" r="13" fill="#E7EEFB"/><text x="23" y="28" text-anchor="middle" font-size="14">⛽</text>
      <text x="46" y="21" font-size="13" fill="#5A6A85">Fuel</text>
      <text x="46" y="37" font-size="14" fill="#0A2A66">AED 600</text>
    </g>
    <g transform="translate(58 260)">
      <rect width="190" height="46" rx="23" fill="#fff" filter="url(#shadow)"/>
      <circle cx="23" cy="23" r="13" fill="#EAF3FF"/><text x="23" y="28" text-anchor="middle" font-size="14">✈</text>
      <text x="46" y="21" font-size="13" fill="#5A6A85">Travel</text>
      <text x="46" y="37" font-size="14" fill="#0A2A66">AED 400</text>
    </g>
  </g>

  <!-- flow lines into the Earnn picker -->
  <g fill="none" stroke="url(#flow)" stroke-width="3" stroke-linecap="round">
    <path d="M226 85 C 300 85, 300 195, 350 195"/>
    <path d="M250 151 C 300 151, 310 195, 350 195"/>
    <path d="M226 217 C 290 217, 310 200, 350 197"/>
    <path d="M250 283 C 300 283, 300 205, 350 199"/>
  </g>

  <!-- Earnn picker -->
  <g filter="url(#shadow)">
    <circle cx="385" cy="196" r="38" fill="#fff"/>
    <circle cx="385" cy="196" r="38" fill="none" stroke="#4ee0b2" stroke-width="3" stroke-dasharray="6 6"/>
  </g>
  <text x="385" y="202" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" fill="#0A2A66">earnn</text>
  <path d="M430 196 L 480 196" stroke="#FFD76A" stroke-width="4" stroke-linecap="round"/>
  <path d="M470 186 L 482 196 L 470 206" fill="none" stroke="#FFD76A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the winning card -->
  <g transform="translate(500 106) rotate(-5 120 80)" filter="url(#shadow)">
    <rect width="240" height="152" rx="18" fill="url(#card)"/>
    <rect x="22" y="48" width="38" height="28" rx="6" fill="#fff" fill-opacity="0.55"/>
    <path d="M22 62h38M41 48v28" stroke="#B8801A" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="22" y="30" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" fill="#5A4200">YOUR BEST CARD</text>
    <text x="22" y="128" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" fill="#3D2F00">5% back</text>
    <circle cx="206" cy="124" r="14" fill="#fff" fill-opacity="0.45"/>
    <circle cx="190" cy="124" r="14" fill="#fff" fill-opacity="0.7"/>
  </g>

  <!-- best match badge with crown -->
  <g transform="translate(560 66)" filter="url(#shadow)">
    <rect width="150" height="34" rx="17" fill="#00A67E"/>
    <path d="M17 24 L 15 12 L 22 17 L 28 9 L 34 17 L 41 12 L 39 24 Z" fill="#FFE9A8"/>
    <text x="50" y="22" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="800" fill="#fff">Best match</text>
  </g>

  <!-- earn amount -->
  <g transform="translate(528 300)" filter="url(#shadow)">
    <rect width="212" height="58" rx="16" fill="#fff"/>
    <text x="18" y="25" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#5A6A85">You could earn</text>
    <text x="18" y="46" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#00A67E">AED 4,380 / year</text>
  </g>
  <text x="400" y="408" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#c9d8f5" fill-opacity="0.8">Example</text>
</svg>
